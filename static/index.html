<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共采购密封投标</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:28px auto;padding:0 20px;color:#28343e}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d5dde3;padding:7px}th{background:#eef4f7}.card{background:#eef8f3;border-left:5px solid #23845b;padding:12px 16px}.ok{color:#23845b;font-weight:600}.bad{color:#b3372f;font-weight:600}.warn{color:#a86a00;font-weight:600}code{background:#edf0f2;padding:2px 5px}</style>
<h1>公共采购密封投标与评审</h1><div class="card">公开页面只展示项目元数据，投标正文按角色和执行阶段隐藏。写接口需要 <code>X-User</code>、<code>X-Role</code>。</div>
<h2>评分摘要链校验</h2><div class="card" id="chain">加载中…</div>
<table id="rounds"><thead><tr><th>评审轮次</th><th>链节点</th><th>有效评分</th><th>已作废</th><th>待核</th><th>作废事件</th><th>校验状态</th></tr></thead><tbody></tbody></table>
<h2>采购项目</h2><table id="tenders"><thead><tr><th>编号</th><th>标题</th><th>状态</th><th>截止时间</th><th>评审轮次</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>投标元数据</h2><table id="bids"><thead><tr><th>项目</th><th>供应商</th><th>报价</th><th>状态</th><th>承诺哈希</th></tr></thead><tbody></tbody></table>
<script>
const STATUS={ok:['链完整','ok'],broken:['存在断点','bad'],blocked:['已阻断授标','bad'],pending:['有待核记录','warn']};
async function loadChain(){
  const c=await fetch('/api/chain/status').then(r=>r.json());
  const[label,cls]=STATUS[c.status]||[c.status,'warn'];
  const brk=c.break_at?`断点位置:链节点 seq=${c.break_at.seq}（${c.break_at.reason}）`:'断点位置:无';
  document.querySelector('#chain').innerHTML=`校验状态:<span class="${cls}">${label}</span>　节点总数:${c.total_nodes}　链末端:seq=${c.tip.seq} <code>${c.tip.hash.slice(0,12)}…</code>　${brk}　校验时间:${c.checked_at}`;
  document.querySelector('#rounds tbody').innerHTML=c.rounds.map(r=>`<tr><td>${r.round}</td><td>${r.nodes}</td><td>${r.valid}</td><td>${r.voided}</td><td>${r.pending}</td><td>${r.events}</td><td class="${r.status==='ok'?'ok':(r.status==='pending'?'warn':'bad')}">${r.status}</td></tr>`).join('');
}
async function load(){const d=await fetch('/api/state').then(r=>r.json());document.querySelector('#tenders tbody').innerHTML=d.tenders.map(r=>`<tr><td>${r.tender_no}</td><td>${r.title}</td><td>${r.status}</td><td>${r.deadline}</td><td>${r.evaluation_round}</td><td>${r.version}</td></tr>`).join('');document.querySelector('#bids tbody').innerHTML=d.bids.map(r=>`<tr><td>${r.tender_id}</td><td>${r.vendor_id}</td><td>${r.price}</td><td>${r.status}</td><td>${r.payload_hash.slice(0,12)}…</td></tr>`).join('')}
load();loadChain();
</script></html>
