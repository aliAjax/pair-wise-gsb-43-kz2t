<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>公共采购密封投标</title>
<style>body{font:15px/1.6 system-ui,sans-serif;max-width:1180px;margin:28px auto;padding:0 20px;color:#28343e}table{border-collapse:collapse;width:100%;margin:14px 0}th,td{border:1px solid #d5dde3;padding:7px}th{background:#eef4f7}.card{background:#eef8f3;border-left:5px solid #23845b;padding:12px 16px}.ok{color:#1c7a4d;font-weight:600}.bad{color:#b03a2e;font-weight:600}.warn{color:#b7791f;font-weight:600}code{background:#edf0f2;padding:2px 5px}.rounds span{display:inline-block;margin:2px 8px 2px 0;padding:1px 8px;border-radius:10px;background:#edf4f1}.bp{font-size:13px;color:#b03a2e}</style>
<h1>公共采购密封投标与评审</h1><div class="card">公开页面展示项目元数据与<strong>评标留痕摘要链校验状态</strong>。投标正文按角色和执行阶段隐藏；写接口需要 <code>X-User</code>、<code>X-Role</code>。</div>
<h2>采购项目</h2><table id="tenders"><thead><tr><th>编号</th><th>标题</th><th>状态</th><th>截止时间</th><th>评审轮次</th><th>版本</th></tr></thead><tbody></tbody></table>
<h2>投标元数据</h2><table id="bids"><thead><tr><th>项目</th><th>供应商</th><th>报价</th><th>状态</th><th>承诺哈希</th></tr></thead><tbody></tbody></table>
<h2>评标留痕摘要链（每轮校验状态）</h2><table id="chains"><thead><tr><th>项目</th><th>链校验</th><th>节点数</th><th>各轮状态</th><th>末节点哈希</th><th>断点位置</th></tr></thead><tbody></tbody></table>
<script>
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
async function load(){
 const d=await fetch('/api/state').then(r=>r.json());
 document.querySelector('#tenders tbody').innerHTML=d.tenders.map(r=>`<tr><td>${esc(r.tender_no)}</td><td>${esc(r.title)}</td><td>${esc(r.status)}</td><td>${esc(r.deadline)}</td><td>${r.evaluation_round}</td><td>${r.version}</td></tr>`).join('');
 document.querySelector('#bids tbody').innerHTML=d.bids.map(r=>`<tr><td>${r.tender_id}</td><td>${r.vendor_id}</td><td>${r.price}</td><td>${esc(r.status)}</td><td>${esc((r.payload_hash||'').slice(0,12))}…</td></tr>`).join('')||'<tr><td colspan=5>（公开页不展示投标明细）</td></tr>';
 document.querySelector('#chains tbody').innerHTML=(d.chain_status||[]).map(c=>{
   const badge=c.verified?'<span class=ok>完整 ✓</span>':'<span class=bad>断裂 ✗</span>';
   const rounds=c.rounds.map(r=>{const cls=r.status==='完整'?'ok':(r.status==='断裂'?'bad':'warn');return `<span class=rounds><b>第${r.round}轮</b> <span class=${cls}>${esc(r.status)}</span>（评分节点${r.score_nodes}${r.events.void?'，作废'+r.events.void:''}${r.events.round_reset?'，重评'+r.events.round_reset:''}${r.events.award?'，已授标冻结':''}）</span>`}).join('')||'<span class=warn>暂无评分</span>';
   const bp=c.breakpoint?`<span class=bp>节点 #${c.breakpoint.seq}（${esc(c.breakpoint.kind)}，${esc(c.breakpoint.node_status)}）：${esc((c.breakpoint.reasons||[]).join('；'))}</span>`:'<span class=ok>无</span>';
   return `<tr><td>${esc(c.tender_no)}<br><small>${esc(c.title||'')}</small></td><td>${badge}${c.counts.pending?'<div class=warn>待核记录 '+c.counts.pending+' 条</div>':''}</td><td>${c.nodes}</td><td class=rounds>${rounds}</td><td><code>${esc(c.last_hash||'—')}</code></td><td>${bp}</td></tr>`;
 }).join('')||'<tr><td colspan=6>暂无评标留痕</td></tr>';
}
load();
</script></html>
